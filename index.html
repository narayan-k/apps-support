<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="iPhone apps by independent developer Narayan Kuleindiren.">
  <meta name="theme-color" content="#f5f5f3">
  <meta property="og:title" content="Apps by Narayan">
  <meta property="og:description" content="A small collection of thoughtful iPhone apps.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://apps.narayankuleindiren.com/">
  <link rel="canonical" href="https://apps.narayankuleindiren.com/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
  <title>Apps by Narayan</title>
</head>
<body>
  <header class="site-header page-shell">
    <a class="site-name" href="/" aria-current="page">Apps by Narayan</a>
    <a class="quiet-link" href="mailto:nkuleindiren@gmail.com">Contact</a>
  </header>

  <main class="page-shell home-main">
    <div class="intro">
      <p class="eyebrow">Independent iOS apps</p>
      <h1>Small apps,<br>made with care.</h1>
    </div>

    <section class="app-grid" aria-label="Apps">
      <a class="app-card app-card--scene" href="/scene/">
        <div class="scene-mark scene-mark--large" aria-hidden="true">
          <span class="shape shape--circle"></span>
          <span class="shape shape--square"></span>
          <span class="shape shape--triangle"></span>
        </div>
        <div class="card-copy">
          <p class="card-kicker">Coming soon</p>
          <h2>Scene</h2>
          <p>Look. Remember. Recreate.</p>
        </div>
        <span class="card-link">Explore Scene</span>
      </a>

      <a class="app-card app-card--secondary" href="/since-then/">
        <img class="app-icon app-icon--card" src="/assets/since-then-icon.png" alt="" width="88" height="88">
        <div class="card-copy">
          <p class="card-kicker">Available now</p>
          <h2>Since Then</h2>
          <p>See how long it has been since the moments that matter.</p>
        </div>
        <span class="card-link">Explore Since Then</span>
      </a>
    </section>
  </main>

  <footer class="site-footer page-shell">
    <p>© 2026 Narayan Kuleindiren</p>
  </footer>
</body>
</html>
